<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify Your Email — IOT Smart Water Metering System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="no-guard">

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">📧</div>
    <div class="login-title">Verify your email</div>
    <div class="login-sub" id="verifyTargetEmail">SENDING…</div>

    <p style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:20px;">
      We've sent a verification link to your inbox (check spam too). Click it,
      then come back here and press <strong>I've verified</strong>.
    </p>

    <button class="login-btn" id="checkBtn">I've verified — Continue</button>
    <button class="login-btn" id="resendBtn" style="margin-top:10px;background:var(--surface);color:var(--text);border:1px solid var(--border);">Resend email</button>
    <div class="login-error" id="verifyError"></div>
    <div class="login-switch">
      <a href="#" id="signOutLink">Sign out</a>
    </div>
  </div>
</div>

<script src="js/verify.js"></script>
</body>
</html>
