<!DOCTYPE html>
<html>

<head>
  <title>ESP32 Smart Water Dashboard</title>

  <style>

    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #141e30, #243b55);
      color: white;
      text-align: center;
    }

    h1 {
      padding-top: 20px;
      font-size: 35px;
    }

    .container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 30px;
    }

    .card {
      width: 250px;
      padding: 25px;
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .title {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .value {
      font-size: 50px;
      font-weight: bold;
      color: #00ffcc;
    }

    .timeValue {
      font-size: 25px;
      color: #fff700;
      line-height: 1.5;
    }

    .alertON {
      color: red;
      font-size: 30px;
      font-weight: bold;
    }

    .alertOFF {
      color: lime;
      font-size: 30px;
      font-weight: bold;
    }

    .graphCard {
      width: 90%;
      max-width: 1000px;
      margin: 30px auto;
      padding: 30px;
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    canvas {
      background: white;
      border-radius: 10px;
      padding: 10px;
    }

    .footer {
      margin-top: 30px;
      padding-bottom: 20px;
      opacity: 0.7;
    }

  </style>
</head>

<body>

  <h1>💧 Smart Water Monitoring Dashboard</h1>

  <div class="container">

    <!-- Water 1 -->
    <div class="card">
      <div class="title">Live Usage</div>
      <div class="value" id="flowRate">0</div>
    </div>

    <!-- Water 2 -->
    <div class="card">
      <div class="title">Total Usage</div>
      <div class="value" id="totalLiters">0</div>
    </div>

    <!-- Water 3 -->
    <div class="card">
      <div class="title">Water Meter 3</div>
      <div class="value" id="water2">0</div>
    </div>

    <!-- Monthly -->
    <div class="card">
      <div class="title">Monthly Usage</div>
      <div class="value" id="monthly">0</div>
    </div>

    <!-- Alert -->
    <div class="card">
      <div class="title">Alert Status</div>
      <div id="alert" class="alertOFF">NORMAL</div>
    </div>

    <!-- Date Time -->
    <div class="card">
      <div class="title">Date & Time</div>
      <div id="datetime" class="timeValue">
        Loading...
      </div>
    </div>

  </div>

  <!-- Graph -->
  <div class="graphCard">

    <div class="title">📈 Live Water Usage Graph</div>

    <canvas id="waterChart"></canvas>

  </div>

  <div class="footer">
    Firebase Real-time Smart Water System 🚀
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>

    // Firebase Config
    const firebaseConfig = {

      databaseURL:
      "https://esp32-69fc8-default-rtdb.asia-southeast1.firebasedatabase.app/"

    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.database();

    // ---------------- DATE & TIME ----------------

    function updateDateTime() {

      const now = new Date();

      document.getElementById("datetime").innerHTML =

        now.toLocaleDateString() +

        "<br>" +

        now.toLocaleTimeString();
    }

    setInterval(updateDateTime, 1000);

    updateDateTime();

    // ---------------- WATER VALUES ----------------

    db.ref("/live/Water").on("value", (snapshot) => {

      const value = snapshot.val();

      document.getElementById("flowRate").innerHTML = value;

      addGraphData(value);

    });

    db.ref("/live/Water1").on("value", (snapshot) => {

      document.getElementById("totalLiters").innerHTML =
        snapshot.val();

    });

    db.ref("/live/Water2").on("value", (snapshot) => {

      document.getElementById("water2").innerHTML =
        snapshot.val();

    });

    // ---------------- MONTHLY ----------------

    db.ref("/monthly/2026/05/Water").on("value", (snapshot) => {

      document.getElementById("monthly").innerHTML =
        snapshot.val();

    });

    // ---------------- ALERT ----------------

    db.ref("/alert/status").on("value", (snapshot) => {

      const status = snapshot.val();

      if (status == 1) {

        document.getElementById("alert").innerHTML =
          "LIMIT REACHED";

        document.getElementById("alert").className =
          "alertON";

      } else {

        document.getElementById("alert").innerHTML =
          "NORMAL";

        document.getElementById("alert").className =
          "alertOFF";
      }

    });

    // ---------------- GRAPH ----------------

    const ctx = document.getElementById('waterChart');

    const waterChart = new Chart(ctx, {

      type: 'line',

      data: {

        labels: [],

        datasets: [{

          label: 'Water Usage',

          data: [],

          borderWidth: 3,

          tension: 0.4

        }]
      },

      options: {

        responsive: true,

        scales: {

          y: {

            beginAtZero: true
          }
        }
      }
    });

    function addGraphData(value) {

      const time = new Date().toLocaleTimeString();

      waterChart.data.labels.push(time);

      waterChart.data.datasets[0].data.push(value);

      // Keep only last 10 values
      if (waterChart.data.labels.length > 10) {

        waterChart.data.labels.shift();

        waterChart.data.datasets[0].data.shift();
      }

      waterChart.update();
    }

  </script>

</body>
</html>
